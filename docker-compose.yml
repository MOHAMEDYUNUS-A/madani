version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: madani_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: madani_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: madani_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: madani_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/madani_db
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_MODE=local
      - STORAGE_DIR=/app/storage
      - JWT_SECRET=supersecretjwtsecretkeychangeinproduction12345!
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - shared-storage:/app/storage

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: madani_worker
    restart: always
    command: celery -A app.workers.tasks.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/madani_db
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_MODE=local
      - STORAGE_DIR=/app/storage
    depends_on:
      - db
      - redis
    volumes:
      - shared-storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: madani_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata:
  shared-storage:
