name: Continuous Integration & Automated Verification

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  backend-qa:
    name: Backend Lint, Types & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Run Ruff Linter & Formatting Checks
        run: |
          ruff check app tests || true

      - name: Execute Pytest Suite with Isolated DB & Coverage
        env:
          DATABASE_URL: "sqlite:///./test_ci.db"
          SECRET_KEY: "ci-testing-secret-key-do-not-use-in-production"
          ENVIRONMENT: "testing"
        run: |
          python -m pytest tests -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload Backend Test Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: backend/coverage.xml
          retention-days: 7

  frontend-qa:
    name: Frontend Lint, Types & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Verify TypeScript Compilation
        run: npx tsc --noEmit

      - name: Execute Vitest Frontend Unit Tests
        run: npm test

      - name: Next.js Production Build
        run: npm run build

  e2e-testing:
    name: Playwright End-to-End Suite
    needs: [backend-qa, frontend-qa]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Backend API Server in Background
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:///./e2e_ci.db"
          PORT: 8000
        run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 3

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build and Start Frontend Server
        working-directory: frontend
        run: |
          npm run build
          npm run start -- -p 3000 &
          sleep 5

      - name: Run Playwright E2E Tests
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: "http://localhost:3000"
        run: npx playwright test

      - name: Upload Playwright Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  container-build-check:
    name: Docker Container Build Verification
    needs: [backend-qa, frontend-qa]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: madani-backend:ci-check

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: madani-frontend:ci-check
