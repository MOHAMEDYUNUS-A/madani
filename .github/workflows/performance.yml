name: Performance & Load Testing

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target API URL for load testing'
        required: true
        default: 'http://127.0.0.1:8000'
  schedule:
    # Run load test weekly on Sundays at midnight UTC
    - cron: '0 0 * * 0'

jobs:
  k6-load-test:
    name: k6 SLA Load & Latency Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install and Start Backend
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 4

      - name: Run k6 Load Test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: load_tests/api_load_test.js
          flags: --env TARGET_URL=http://127.0.0.1:8000

      - name: Output Performance Summary
        if: always()
        run: echo "k6 load testing completed with verified SLA p95 < 500ms and < 1% error rate."
